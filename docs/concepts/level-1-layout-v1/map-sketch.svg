<text x="769.9" y="556.6" font-size="17" fill="#eccd8f" >Siegel: E / Touch</text>
<text x="769.9" y="579.4" font-size="16" fill="#d0a28a" >Zugang schließt</text>
<text x="469.7" y="1174.1" font-size="18" fill="#9ed5c7" >Arc · 100 HP · 50 Rüstung</text>
<text x="530.5" y="250.7" font-size="18" fill="#ead7a3" text-anchor="middle">→ Kristallkluft nach Sieg</text>
<text x="875" y="230" font-size="24" fill="#d9dbc7" text-anchor="middle" font-weight="700">N</text>
<path d="M875 242 V293 M865 255 L875 242 L885 255" fill="none" stroke="#a9bcb8" stroke-width="3"/>
<text x="91" y="1248" font-size="17" fill="#8fa5a3" >Planungsraster: 2 m</text>
<text x="91" y="1279" font-size="17" fill="#a9b9b3" >Zielgröße ca. 44 × 48 m · Grundriss / Abstände noch abstimmbar</text>
<text x="1070" y="225" font-size="19" fill="#9fbfc0" letter-spacing="2" font-weight="700">SPIELABLAUF</text>
<text x="1070" y="266" font-size="23" fill="#f1dfb6" font-weight="700">5 Pflichtgegner + 2 optional + Boss</text>
<text x="1070" y="299" font-size="19" fill="#eae9db" >Hauptweg: A → B → C → E → F → G → H</text>
<text x="1070" y="329" font-size="19" fill="#92d9d9" >Erkunden: C → D → C</text>
<text x="1070" y="385" font-size="21" fill="#e5e2cc" font-weight="700">A   Sicher ankommen</text>
<text x="1070" y="414" font-size="18" fill="#b9c7c0" >Arc ausgerüstet. Ruinen und Nordtor</text>
<text x="1070" y="440" font-size="18" fill="#b9c7c0" >geben von Beginn an die Richtung vor.</text>
<text x="1070" y="484" font-size="21" fill="#e5e2cc" font-weight="700">B / C   Erste Begegnung &amp; Waffe</text>
<text x="1070" y="513" font-size="18" fill="#b9c7c0" >2 Steinläufer hinter niedriger Deckung.</text>
<text x="1070" y="539" font-size="18" fill="#b9c7c0" >Danach Pulse mit 54 Schuss am Hauptweg.</text>
<text x="1070" y="583" font-size="21" fill="#e5e2cc" font-weight="700">D   Kleiner lohnender Umweg</text>
<text x="1070" y="612" font-size="18" fill="#b9c7c0" >Sichtbare Stufen auf die Seitenterrasse.</text>
<text x="1070" y="638" font-size="18" fill="#b9c7c0" >2 Läufer · +35 HP / +30 Rüstung / +27 Ammo.</text>
<text x="1070" y="682" font-size="21" fill="#e5e2cc" font-weight="700">E   Gemischte Dreiergruppe</text>
<text x="1070" y="711" font-size="18" fill="#b9c7c0" >2 Läufer + 1 Werfer auf niedrigem Sockel.</text>
<text x="1070" y="737" font-size="18" fill="#b9c7c0" >Seitenmauern blocken Würfe. +27 Ammo.</text>
<text x="1070" y="781" font-size="21" fill="#e5e2cc" font-weight="700">F   Ruhepunkt vor dem Boss</text>
<text x="1070" y="810" font-size="18" fill="#b9c7c0" >Öffnet nach den 5 Pflichtgegnern.</text>
<text x="1070" y="836" font-size="18" fill="#b9c7c0" >Checkpoint: 100 HP / 50 Rüstung / 54 Ammo.</text>
<text x="1070" y="880" font-size="21" fill="#e5e2cc" font-weight="700">G   Boss bewusst wecken</text>
<text x="1070" y="909" font-size="18" fill="#b9c7c0" >E / Touch am Siegel startet den Kampf.</text>
<text x="1070" y="935" font-size="18" fill="#b9c7c0" >2 × 18 Ammo; +35 HP auf Seitenplateau.</text>
<text x="1070" y="979" font-size="21" fill="#e5e2cc" font-weight="700">H   Weiterreise</text>
<text x="1070" y="1008" font-size="18" fill="#b9c7c0" >Nach dem Sieg öffnet sich das Nordtor.</text>
<text x="1070" y="1034" font-size="18" fill="#b9c7c0" >Durchgehen führt in die Kristallkluft.</text>
