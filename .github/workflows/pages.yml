name: Build and deploy game

on:
  push:
    branches: [main, codex/adventure-environment-test]
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  refresh-adventure-preview:
    if: github.ref == 'refs/heads/codex/adventure-environment-test' && github.event.created != true
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Request Pages release from the permitted deployment branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout live version
        uses: actions/checkout@v6
        with:
          ref: main
          path: live
      - name: Checkout Adventure preview
        uses: actions/checkout@v6
        with:
          ref: codex/adventure-combat-prototype
          path: adventure-source
      - name: Checkout current Adventure environment
        uses: actions/checkout@v6
        with:
          ref: codex/adventure-environment-test
          path: environment-source
      - uses: actions/setup-node@v7
        with:
          node-version-file: live/.nvmrc
          cache: npm
          cache-dependency-path: |
            live/package-lock.json
            adventure-source/package-lock.json
            environment-source/package-lock.json
      - name: Build unchanged live game
        working-directory: live
        run: |
          npm ci
          npm test
          npm run build
      - name: Build public Adventure preview without diagnostics
        working-directory: adventure-source
        run: |
          npm ci
          npm test
          npm run build:adventure-preview
      - name: Build public Adventure environment
        working-directory: environment-source
        run: |
          npm ci
          npm test
          npm run build:environment-preview
      - name: Include both previews alongside live game
        run: |
          mkdir -p live/dist/adventure-preview
          cp -a adventure-source/dist-preview/. live/dist/adventure-preview/
          mkdir -p live/dist/adventure-environment
          cp -a environment-source/dist-environment-preview/. live/dist/adventure-environment/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: live/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish game
        id: deployment
        uses: actions/deploy-pages@v4
