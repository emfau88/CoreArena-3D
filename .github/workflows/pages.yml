name: Build and deploy game

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout live version
        uses: actions/checkout@v6
        with:
          ref: main
          path: live
      - name: Checkout Adventure preview
        uses: actions/checkout@v6
        with:
          ref: codex/adventure-combat-prototype
          path: adventure-source
      - uses: actions/setup-node@v7
        with:
          node-version-file: live/.nvmrc
          cache: npm
          cache-dependency-path: |
            live/package-lock.json
            adventure-source/package-lock.json
      - name: Build unchanged live game
        working-directory: live
        run: |
          npm ci
          npm test
          npm run build
      - name: Build public Adventure preview without diagnostics
        working-directory: adventure-source
        run: |
          npm ci
          npm test
          npm run build:adventure-preview
      - name: Include preview alongside live game
        run: |
          mkdir -p live/dist/adventure-preview
          cp -a adventure-source/dist-preview/. live/dist/adventure-preview/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: live/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish game
        id: deployment
        uses: actions/deploy-pages@v4
